name: CI

# The gates from spec V.0, run on a clean machine: the same commands as
# `pnpm gates` locally, plus guards that only make sense on a fresh checkout.
# ADR-0039 records the scope; the PHP job left with the WordPress host
# (plugins/quote-wizard/ stays only as the reference for the Pass 6 port).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  gates:
    name: Gates (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prettier format check
        run: pnpm format:check

      - name: Lint (ESLint and design check)
        run: pnpm lint

      - name: Typecheck (wizard and Worker)
        run: pnpm typecheck

      - name: Unit tests (wizard, site and Worker)
        run: pnpm test

      - name: Astro check (site)
        run: pnpm --filter @jl/site check

      # Fails on any TODO(josh) placeholder in published content or in the built
      # site (spec T.4): the content checks run during the site build.
      - name: Build (wizard, site, Worker dry run)
        run: pnpm build

      - name: PDF cover rendering on Linux (spec Pass 2 acceptance)
        run: pnpm media:pdf apps/site/public/documents/kerr-microscopy-dissertation.pdf --dry-run

      - name: Guard - no source maps in the site output
        run: |
          if find apps/site/dist -name '*.map' -print -quit | grep -q .; then
            echo "::error::Source map found in apps/site/dist; source maps must not ship."
            find apps/site/dist -name '*.map'
            exit 1
          fi
          echo "OK: no source maps in apps/site/dist."
