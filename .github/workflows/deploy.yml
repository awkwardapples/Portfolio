name: Deploy

# Builds the site and deploys the Worker to Cloudflare on every push to main,
# once a day (to refresh the GitHub snapshot, spec M.1), and on demand.
# If the Cloudflare secrets are not set yet, the deploy job is skipped with a
# notice instead of failing, so merges never go red on that (ADR-0040).
# Set-up steps: docs/deployment.md.

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  preflight:
    name: Check Cloudflare secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Check that the Cloudflare secrets are set
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are set; deploying."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            message="Deploy skipped: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are not set yet. docs/deployment.md lists the steps."
            echo "::notice title=Deploy skipped::$message"
            echo "### Deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Build and deploy
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (wizard, site, Worker dry run)
        env:
          SITE_URL: https://joshlennon.com
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          GH_PROFILE_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}
          GITHUB_USERNAME: awkwardapples
        run: pnpm build

      - name: Create the D1 database on the first deploy
        working-directory: apps/edge
        run: |
          if pnpm exec wrangler d1 info joshlennon-site > /dev/null 2>&1; then
            echo "D1 database joshlennon-site exists."
          else
            pnpm exec wrangler d1 create joshlennon-site --location weur --update-config=false
          fi

      - name: Apply D1 migrations
        working-directory: apps/edge
        run: pnpm exec wrangler d1 migrations apply DB --remote

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/edge
          packageManager: pnpm
          command: deploy
